<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominó Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .hidden { display: none !important; }
        button { padding: 15px; width: 100%; margin: 5px 0; }
    </style>
</head>
<body>
    <div id="app">
        <main id="tela-login">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button onclick="login()">Entrar</button>
        </main>

        <main id="tela-lobby" class="hidden">
            <h2>Lobby</h2>
            <button onclick="criarMesa()">Criar Nova Mesa</button>
            <div id="lista-salas"></div>
        </main>

        <main id="tela-espera" class="hidden">
            <h2 id="titulo-sala">Sala de Espera</h2>
            <ul id="lista-jogadores"></ul>
            <button id="btn-iniciar-jogo" onclick="iniciarJogo()">Iniciar Partida</button>
        </main>

        <main id="tela-jogo" class="hidden">
            <h2>Jogo Iniciado!</h2>
            <div id="tabuleiro">Tabuleiro do Jogo aqui...</div>
        </main>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCnDPInMASJwsZyl8Y7i3sGxL_yttIOZe8", authDomain: "dominoacessivel.firebaseapp.com", databaseURL: "https://dominoacessivel-default-rtdb.firebaseio.com", projectId: "dominoacessivel", storageBucket: "dominoacessivel.firebasestorage.app", messagingSenderId: "253382950798", appId: "1:253382950798:web:76e3c75dd7d687647feedf" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); let salaIdAtual = null;

        function login() {
            firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value)
            .then(() => { document.getElementById('tela-login').className = 'hidden'; document.getElementById('tela-lobby').className = ''; });
        }

        function criarMesa() {
            const sala = db.ref('salas').push();
            sala.set({ admin: firebase.auth().currentUser.uid, status: 'aguardando', jogadores: {[firebase.auth().currentUser.uid]: {nome: 'Admin'}} });
            entrarNaSala(sala.key);
        }

        function entrarNaSala(id) {
            salaIdAtual = id;
            document.getElementById('tela-lobby').className = 'hidden';
            document.getElementById('tela-espera').className = '';
            
            db.ref('salas/' + id).on('value', snap => {
                const s = snap.val();
                if(s.status === 'jogando') {
                    document.getElementById('tela-espera').className = 'hidden';
                    document.getElementById('tela-jogo').className = '';
                }
            });
        }

        function iniciarJogo() {
            db.ref('salas/' + salaIdAtual).update({status: 'jogando'});
        }

        // Listar salas
        db.ref('salas').on('value', snap => {
            const lista = document.getElementById('lista-salas'); lista.innerHTML = '';
            snap.forEach(s => {
                const b = document.createElement('button');
                b.textContent = "Entrar em Mesa: " + s.key;
                b.onclick = () => entrarNaSala(s.key);
                lista.appendChild(b);
            });
        });
    </script>
</body>
</html>
