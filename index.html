<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominó Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        button { padding: 15px; width: 100%; margin: 10px 0; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <main id="tela-login">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="E-mail"><br>
            <input type="password" id="senha" placeholder="Senha"><br>
            <button onclick="logar()">Entrar</button>
        </main>

        <main id="tela-menu" class="hidden">
            <h2>Bem-vindo!</h2>
            <button onclick="criarSala()">Criar Nova Mesa</button>
            <div id="lista-salas"></div>
        </main>

        <main id="tela-espera" class="hidden">
            <h2 id="titulo-sala">Sala de Espera</h2>
            <ul id="lista-jogadores"></ul>
            <button id="btn-iniciar" class="hidden" onclick="iniciarJogo()">Iniciar Partida</button>
        </main>

        <main id="tela-jogo" class="hidden">
            <h2>Partida Online Iniciada!</h2>
            <p>O tabuleiro está carregado.</p>
        </main>
    </div>

    <script>
        const config = { apiKey: "AIzaSyCnDPInMASJwsZyl8Y7i3sGxL_yttIOZe8", authDomain: "dominoacessivel.firebaseapp.com", databaseURL: "https://dominoacessivel-default-rtdb.firebaseio.com", projectId: "dominoacessivel", storageBucket: "dominoacessivel.firebasestorage.app", messagingSenderId: "253382950798", appId: "1:253382950798:web:76e3c75dd7d687647feedf" };
        firebase.initializeApp(config);
        const db = firebase.database(); let salaIdAtual = null;

        function logar() {
            firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value)
            .then(() => {
                document.getElementById('tela-login').className = 'hidden';
                document.getElementById('tela-menu').className = '';
            });
        }

        function criarSala() {
            const sala = db.ref('salas').push();
            sala.set({ admin: firebase.auth().currentUser.uid, status: 'aguardando', jogadores: {[firebase.auth().currentUser.uid]: {nome: 'Admin'}} });
            entrarNaSala(sala.key);
        }

        function entrarNaSala(id) {
            salaIdAtual = id;
            document.getElementById('tela-menu').className = 'hidden';
            document.getElementById('tela-espera').className = '';
            
            db.ref('salas/' + id).on('value', snap => {
                const s = snap.val();
                if(!s) return;
                
                // Exibe jogadores
                const ul = document.getElementById('lista-jogadores'); ul.innerHTML = '';
                Object.keys(s.jogadores).forEach(uid => { 
                    const li = document.createElement('li'); li.textContent = s.jogadores[uid].nome; ul.appendChild(li); 
                });

                // Botão iniciar só para o Admin
                if(s.admin === firebase.auth().currentUser.uid) document.getElementById('btn-iniciar').className = '';

                // Transição real para tela de jogo
                if(s.status === 'jogando') {
                    document.getElementById('tela-espera').className = 'hidden';
                    document.getElementById('tela-jogo').className = '';
                }
            });
        }

        function iniciarJogo() {
            db.ref('salas/' + salaIdAtual).update({status: 'jogando'});
        }

        // Listagem de salas
        db.ref('salas').on('value', snap => {
            const list = document.getElementById('lista-salas'); list.innerHTML = '';
            snap.forEach(s => {
                if(s.val().status === 'aguardando') {
                    const b = document.createElement('button');
                    b.textContent = "Entrar na Mesa: " + s.key.substring(0,5);
                    b.onclick = () => entrarNaSala(s.key);
                    list.appendChild(b);
                }
            });
        });
    </script>
</body>
</html>
