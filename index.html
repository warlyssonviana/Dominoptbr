<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominó Acessível - Multiplayer Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        button { padding: 15px; margin: 5px; width: 100%; font-size: 1.2rem; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <main id="tela-login">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button id="btn-login">Entrar</button>
            <button id="btn-cadastro">Criar Conta</button>
        </main>

        <main id="tela-lobby" class="hidden">
            <h2>Bem-vindo, <span id="display-nome"></span></h2>
            <button id="btn-criar-mesa">Criar Nova Mesa</button>
            <div id="lista-salas"></div>
        </main>

        <main id="tela-mesa" class="hidden">
            <h2 id="titulo-sala">Mesa</h2>
            <ul id="lista-jogadores"></ul>
            <button id="btn-iniciar" class="hidden">Iniciar Partida</button>
            <button id="btn-sair" class="btn-perigo">Sair da Mesa</button>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCnDPInMASJwsZyl8Y7i3sGxL_yttIOZe8",
            authDomain: "dominoacessivel.firebaseapp.com",
            databaseURL: "https://dominoacessivel-default-rtdb.firebaseio.com",
            projectId: "dominoacessivel",
            storageBucket: "dominoacessivel.firebasestorage.app",
            messagingSenderId: "253382950798",
            appId: "1:253382950798:web:76e3c75dd7d687647feedf"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();

        // Autenticação
        document.getElementById('btn-login').onclick = () => auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value);
        document.getElementById('btn-cadastro').onclick = () => auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value).then(user => {
            db.ref('usuarios/' + user.user.uid).set({ apelido: document.getElementById('input-apelido').value, nivel: 'usuario' });
        });

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('tela-login').className = 'hidden';
                document.getElementById('tela-lobby').className = '';
                db.ref('usuarios/' + user.uid).once('value', s => document.getElementById('display-nome').textContent = s.val().apelido);
                carregarSalas();
            }
        });

        // Salas
        document.getElementById('btn-criar-mesa').onclick = () => {
            const novaSala = db.ref('salas').push();
            novaSala.set({ adminUID: auth.currentUser.uid, status: 'aguardando', jogadores: { [auth.currentUser.uid]: { nome: 'Admin' } } });
            entrarNaSala(novaSala.key);
        };

        function carregarSalas() {
            db.ref('salas').on('value', snap => {
                const lista = document.getElementById('lista-salas'); lista.innerHTML = '';
                snap.forEach(s => {
                    const div = document.createElement('div'); div.className = 'sala-item';
                    div.innerHTML = `<span>Sala: ${s.key}</span><button onclick="entrarNaSala('${s.key}')">Entrar</button>`;
                    lista.appendChild(div);
                });
            });
        }

        function entrarNaSala(id) {
            db.ref(`salas/${id}/jogadores/${auth.currentUser.uid}`).set({ nome: 'Jogador' });
            document.getElementById('tela-lobby').className = 'hidden';
            document.getElementById('tela-mesa').className = '';
            monitorarSala(id);
        }

        function monitorarSala(id) {
            db.ref(`salas/${id}`).on('value', snap => {
                const s = snap.val();
                if(!s) return;
                const ul = document.getElementById('lista-jogadores'); ul.innerHTML = '';
                Object.keys(s.jogadores).forEach(uid => {
                    const li = document.createElement('li'); li.textContent = s.jogadores[uid].nome;
                    if(s.adminUID === auth.currentUser.uid && uid !== auth.currentUser.uid) {
                        const btn = document.createElement('button'); btn.textContent = 'Expulsar';
                        btn.onclick = () => db.ref(`salas/${id}/jogadores/${uid}`).remove();
                        li.appendChild(btn);
                    }
                    ul.appendChild(li);
                });
                if(s.adminUID === auth.currentUser.uid) document.getElementById('btn-iniciar').className = '';
            });
        }
    </script>
</body>
</html>
