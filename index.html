<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominó Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 20px; width: 100%; margin: 10px 0; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div id="app">
        <div id="login-area">
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button onclick="logar()">Entrar</button>
        </div>

        <div id="menu-area" style="display:none;">
            <button onclick="criarSala()">Criar Nova Mesa</button>
            <div id="lista-salas"></div>
        </div>

        <div id="mesa-area" style="display:none;">
            <h2 id="status-mesa">Aguardando...</h2>
            <button id="btn-iniciar-jogo" onclick="iniciarJogo()">Iniciar Partida</button>
        </div>
    </div>

    <script>
        const config = { apiKey: "AIzaSyCnDPInMASJwsZyl8Y7i3sGxL_yttIOZe8", authDomain: "dominoacessivel.firebaseapp.com", databaseURL: "https://dominoacessivel-default-rtdb.firebaseio.com", projectId: "dominoacessivel", storageBucket: "dominoacessivel.firebasestorage.app", messagingSenderId: "253382950798", appId: "1:253382950798:web:76e3c75dd7d687647feedf" };
        firebase.initializeApp(config);
        
        function logar() {
            firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value)
            .then(() => {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('menu-area').style.display = 'block';
            });
        }

        function criarSala() {
            const sala = firebase.database().ref('salas').push();
            sala.set({ status: 'aguardando', admin: firebase.auth().currentUser.uid });
            entrarSala(sala.key);
        }

        function entrarSala(id) {
            document.getElementById('menu-area').style.display = 'none';
            document.getElementById('mesa-area').style.display = 'block';
            firebase.database().ref('salas/' + id).on('value', snap => {
                const s = snap.val();
                if(s.status === 'jogando') {
                    document.getElementById('status-mesa').innerText = "JOGO INICIADO COM SUCESSO!";
                }
            });
            window.salaAtual = id;
        }

        function iniciarJogo() {
            firebase.database().ref('salas/' + window.salaAtual).update({status: 'jogando'});
        }

        firebase.database().ref('salas').on('value', snap => {
            const list = document.getElementById('lista-salas'); list.innerHTML = '';
            snap.forEach(s => {
                const b = document.createElement('button');
                b.textContent = "Entrar na Mesa " + s.key.substring(0,5);
                b.onclick = () => entrarSala(s.key);
                list.appendChild(b);
            });
        });
    </script>
</body>
</html>
