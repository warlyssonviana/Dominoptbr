<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dominó Acessível - Multiplayer Oficial</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        button { padding: 15px; margin: 10px 0; width: 100%; font-size: 1.2rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <main id="tela-login">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button id="btn-entrar">Entrar</button>
        </main>

        <main id="tela-menu" class="hidden">
            <h2>Usuários Online: <span id="qtd-online">0</span></h2>
            <h2>Salas Disponíveis: <span id="qtd-salas">0</span></h2>
            <button onclick="escolherModo()">Jogar Partida</button>
        </main>

        <main id="tela-mesa" class="hidden">
            <h2 id="titulo-sala">Mesa</h2>
            <ul id="lista-jogadores"></ul>
            <button id="btn-iniciar" class="hidden">Iniciar Partida</button>
        </main>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCnDPInMASJwsZyl8Y7i3sGxL_yttIOZe8", authDomain: "dominoacessivel.firebaseapp.com", databaseURL: "https://dominoacessivel-default-rtdb.firebaseio.com", projectId: "dominoacessivel", storageBucket: "dominoacessivel.firebasestorage.app", messagingSenderId: "253382950798", appId: "1:253382950798:web:76e3c75dd7d687647feedf" };
        firebase.initializeApp(firebaseConfig);
        
        // Sincronização automática
        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                document.getElementById('tela-login').className = 'hidden';
                document.getElementById('tela-menu').className = '';
                firebase.database().ref('lobby/presenca/' + user.uid).set(true);
                firebase.database().ref('lobby/presenca').on('value', s => document.getElementById('qtd-online').innerText = s.numChildren());
                firebase.database().ref('salas').on('value', s => document.getElementById('qtd-salas').innerText = s.numChildren());
            }
        });

        document.getElementById('btn-entrar').onclick = () => firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('senha').value);

        function escolherModo() {
            const modo = confirm("Deseja jogar MODO ONLINE? (Cancelar inicia modo Offline)");
            if(modo) {
                const sala = firebase.database().ref('salas').push();
                sala.set({ admin: firebase.auth().currentUser.uid, status: 'aguardando', jogadores: {[firebase.auth().currentUser.uid]: {nome: 'Admin'}} });
                entrarNaSala(sala.key);
            } else {
                alert("Modo Offline iniciado.");
            }
        }

        function entrarNaSala(id) {
            document.getElementById('tela-menu').className = 'hidden';
            document.getElementById('tela-mesa').className = '';
            firebase.database().ref('salas/' + id).on('value', snap => {
                const s = snap.val();
                if(s.admin === firebase.auth().currentUser.uid) document.getElementById('btn-iniciar').className = '';
                document.getElementById('btn-iniciar').onclick = () => {
                    alert("Partida Iniciada com Sucesso!");
                    firebase.database().ref('salas/' + id).update({status: 'jogando'});
                };
            });
        }
    </script>
</body>
</html>
